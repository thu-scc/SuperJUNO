[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superjuno"
version = "0.1.0"
description = "PMT waveform and event reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cupy==14.2.0",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "h5py==3.16.0",
    "hdf5plugin==7.1.0",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "numexpr==2.14.2",
    "duckdb==1.5.6",
    "tqdm==4.70.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "detector",
    "fsmp",
    "fsmp_prior",
    "fsmp_reader",
    "main",
    "mcmc",
    "recon",
    "recon_random",
    "wave_reader",
    "wave_reader_impl",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["analysis*"]

[tool.setuptools.package-data]
"analysis.fsmp" = ["*.cu"]
